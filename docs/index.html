<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Que — Wake Up With Purpose</title>
  <style>
    :root {
      --bg: #faf9f7;
      --fg: #1a1a1a;
      --muted: #666;
      --link: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --fg: #f0eeeb;
        --muted: #999;
        --link: #60a5fa;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      padding: 3rem 1.5rem;
      max-width: 640px;
      margin: 0 auto;
      text-align: center;
    }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
    .tagline { color: var(--muted); font-size: 1.1rem; margin-bottom: 2.5rem; }
    nav a {
      display: inline-block;
      color: var(--link);
      text-decoration: none;
      margin: 0 1rem;
      font-size: 1rem;
    }
    nav a:hover { text-decoration: underline; }
    .footer { color: var(--muted); font-size: 0.85rem; margin-top: 3rem; }
  </style>
</head>
<body>
  <h1>Que</h1>
  <p class="tagline">Your morning sets everything. Que makes sure it counts.</p>
  <nav>
    <a href="support.html">Support</a>
    <a href="privacy.html">Privacy Policy</a>
  </nav>
  <p class="footer">&copy; 2026 Que. All rights reserved.</p>
</body>
</html>
